<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교실 사물 숨바꼭질</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:#111827;color:#fff;overflow:hidden}header{height:58px;display:flex;align-items:center;gap:16px;padding:0 18px;background:#0b1220}#hud{margin-left:auto;display:flex;gap:16px}.pill{background:#253247;padding:6px 10px;border-radius:999px}canvas{display:block}.overlay{position:fixed;inset:58px 0 0;display:flex;align-items:center;justify-content:center;background:#0b1220cc;z-index:3}.card{width:min(520px,92vw);background:#fff;color:#172033;padding:24px;border-radius:18px}.card button{font:inherit;border:0;border-radius:10px;padding:12px 16px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer;margin-right:8px}.small{color:#667085;font-size:13px}#msg{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#111d;padding:9px 14px;border-radius:10px;z-index:2}#help{position:fixed;bottom:12px;left:12px;background:#111d;padding:9px 12px;border-radius:10px;font-size:13px}</style></head><body>
<header><b>🏫 교실 사물 숨바꼭질</b><span id="role" class="pill">역할 선택</span><div id="hud"><span id="shots">🔍 찾기 8회</span><span id="left">🙈 생존 0</span></div></header><canvas id="g"></canvas><div id="msg">숨는 사람은 사물을 골라 숨어보세요!</div><div id="help">이동 WASD/방향키 · E 가까운 사물에 숨기/나오기 · 술래는 사물을 클릭해 찾기</div>
<div id="menu" class="overlay"><div class="card"><h2>🎮 사물 속 숨바꼭질</h2><p><b>숨는 사람:</b> 맵을 돌아다니다 책상·사물함·화분·책장 등에 들어가 숨습니다.<br><b>술래:</b> 누가 어디 숨었는지 모릅니다. 사물을 클릭해서 확인하며 <b>찾기 횟수는 8번</b>뿐입니다.</p><button id="hide">🙈 숨는 사람 체험</button><button id="seek">🔎 술래 체험</button><p class="small">현재는 게임 방식 확인용 데모입니다. 이 방식이 맞으면 다음 단계에서 25명 실시간 방으로 연결합니다.</p></div></div>
<script>
const c=document.querySelector('#g'),q=c.getContext('2d');let W,H,keys={},me,mode='',inside=null,shots=8,bots=[],last=0,running=false;
const items=[
{id:1,n:'사물함',x:.08,y:.10,w:.14,h:.20,c:'#8b6a49'},{id:2,n:'책장',x:.30,y:.08,w:.18,h:.16,c:'#76563c'},{id:3,n:'교탁',x:.58,y:.11,w:.18,h:.12,c:'#966f45'},{id:4,n:'캐비닛',x:.80,y:.08,w:.12,h:.23,c:'#64748b'},
{id:5,n:'책상',x:.10,y:.42,w:.13,h:.10,c:'#a47b4e'},{id:6,n:'책상',x:.30,y:.42,w:.13,h:.10,c:'#a47b4e'},{id:7,n:'책상',x:.50,y:.42,w:.13,h:.10,c:'#a47b4e'},{id:8,n:'책상',x:.70,y:.42,w:.13,h:.10,c:'#a47b4e'},
{id:9,n:'화분',x:.12,y:.72,w:.07,h:.13,c:'#4f7a45'},{id:10,n:'청소함',x:.31,y:.69,w:.10,h:.18,c:'#64748b'},{id:11,n:'소파',x:.52,y:.70,w:.19,h:.13,c:'#7c5d55'},{id:12,n:'큰 상자',x:.79,y:.69,w:.11,h:.15,c:'#a87942'}];
function resize(){W=c.width=innerWidth;H=c.height=innerHeight-58;draw()}resize();addEventListener('resize',resize);
function center(o){return{x:(o.x+o.w/2)*W,y:(o.y+o.h/2)*H}}
function start(m){mode=m;document.querySelector('#menu').style.display='none';document.querySelector('#role').textContent=m==='hide'?'🙈 숨는 사람':'🔎 술래';me={x:W*.48,y:H*.60};bots=[];shots=8;inside=null;if(m==='seek'){for(let i=0;i<6;i++){let it=items[Math.floor(Math.random()*items.length)];bots.push({item:it.id,found:false})}}document.querySelector('#left').textContent='🙈 생존 '+bots.filter(b=>!b.found).length;running=true;requestAnimationFrame(loop);draw()}
document.querySelector('#hide').onclick=()=>start('hide');document.querySelector('#seek').onclick=()=>start('seek');
addEventListener('keydown',e=>{if(!running)return;let k=e.key.toLowerCase();keys[k]=1;if(k==='e'&&mode==='hide'){if(inside){inside=null;document.querySelector('#msg').textContent='사물 밖으로 나왔습니다.'}else{let near=items.find(o=>{let p=center(o);return Math.hypot(p.x-me.x,p.y-me.y)<90});if(near){inside=near;document.querySelector('#msg').textContent=near.n+' 안에 숨었습니다! 술래에게는 캐릭터가 보이지 않습니다.'}}}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
c.addEventListener('click',e=>{if(mode!=='seek'||shots<=0)return;let r=c.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;let o=items.find(o=>mx>=o.x*W&&mx<=(o.x+o.w)*W&&my>=o.y*H&&my<=(o.y+o.h)*H);if(!o)return;shots--;let hit=bots.filter(b=>b.item===o.id&&!b.found);if(hit.length){hit.forEach(b=>b.found=true);document.querySelector('#msg').textContent='🎉 찾았다! '+o.n+'에 숨어 있었습니다.'}else document.querySelector('#msg').textContent='❌ '+o.n+'에는 아무도 없습니다.';document.querySelector('#shots').textContent='🔍 찾기 '+shots+'회';document.querySelector('#left').textContent='🙈 생존 '+bots.filter(b=>!b.found).length;draw()});
function loop(t){let dt=Math.min(.03,(t-last)/1000||0);last=t;if(mode==='hide'&&!inside){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),l=Math.hypot(dx,dy)||1;me.x=Math.max(18,Math.min(W-18,me.x+dx/l*200*dt));me.y=Math.max(18,Math.min(H-18,me.y+dy/l*200*dt))}draw();if(running)requestAnimationFrame(loop)}
function draw(){if(!q)return;q.fillStyle='#d9dfd1';q.fillRect(0,0,W,H);q.fillStyle='#c8d0c0';for(let x=0;x<W;x+=80)q.fillRect(x,0,2,H);q.fillStyle='#9fb0bd';q.fillRect(0,0,W,.06*H);q.fillStyle='#2e5d3b';q.fillRect(W*.34,H*.015,W*.32,H*.035);q.fillStyle='white';q.font='bold 14px system-ui';q.fillText('칠 판',W*.485,H*.042);
for(const o of items){q.fillStyle=o.c;q.fillRect(o.x*W,o.y*H,o.w*W,o.h*H);q.fillStyle='#fff';q.font='bold 13px system-ui';q.fillText(o.n,o.x*W+7,o.y*H+20)}
if(mode==='hide'&&!inside&&me){q.beginPath();q.fillStyle='#2563eb';q.arc(me.x,me.y,17,0,Math.PI*2);q.fill();q.fillStyle='#172033';q.textAlign='center';q.fillText('나',me.x,me.y-24);q.textAlign='left'}if(mode==='hide'&&inside){let p=center(inside);q.strokeStyle='#2563eb';q.lineWidth=4;q.strokeRect(inside.x*W-4,inside.y*H-4,inside.w*W+8,inside.h*H+8);q.fillStyle='#172033';q.fillText('내가 숨어 있음',p.x-38,p.y)}
}
draw();
</script></body></html>
