<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리반 숨바꼭질</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:#172033;color:#fff;overflow:hidden}
header{height:58px;display:flex;align-items:center;gap:14px;padding:0 18px;background:#101722}header b{font-size:19px}#hud{margin-left:auto;display:flex;gap:14px}
canvas{display:block;background:#d9e8d0}.overlay{position:fixed;inset:58px 0 0;display:flex;align-items:center;justify-content:center;background:#111a;z-index:3}
.card{width:min(520px,92vw);background:#fff;color:#172033;border-radius:20px;padding:24px;box-shadow:0 20px 70px #0008}
input,button{font:inherit;padding:12px;border-radius:10px}input{border:1px solid #bbb;width:100%;margin:8px 0 12px}button{border:0;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.secondary{background:#475569}.row{display:flex;gap:10px;flex-wrap:wrap}.small{font-size:13px;color:#667085}.badge{padding:5px 9px;border-radius:999px;background:#263244}
#help{position:fixed;left:14px;bottom:14px;background:#101722dd;padding:9px 12px;border-radius:10px;font-size:13px}#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#111d;padding:9px 14px;border-radius:10px}
</style></head><body>
<header><b>🏫 우리반 숨바꼭질</b><span id="phase" class="badge">연습 게임</span><div id="hud"><span id="alive">🙈 23</span><span id="time">⏱ 03:00</span></div></header>
<canvas id="c"></canvas><div id="toast">닉네임을 입력하고 시작하세요!</div><div id="help">이동 WASD/방향키 · H 위장 · 술래 SPACE 잡기</div>
<div id="join" class="overlay"><div class="card"><h2>🎮 우리반 숨바꼭질</h2><p>학교 안에서 술래를 피해 숨어보세요. 25명 플레이를 위한 완성 화면을 먼저 체험할 수 있습니다.</p>
<label>닉네임 (실명 말고 번호/별명 권장)</label><input id="nick" maxlength="10" placeholder="예: 12번 / 토끼">
<div class="row"><button id="play">게임 시작</button><button id="demo" class="secondary">25명 데모 보기</button></div>
<p class="small">현재는 멀티 서버 연결 전이라 데모/연습 모드입니다. Firebase 연결 후 같은 화면에서 25명이 실제로 함께 움직입니다.</p></div></div>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d');let W,H,keys={},running=false,last=0,me=null,bots=[],hidden=false,seeker=false,start=0;
const obs=[['교실',.05,.08,.22,.14],['사물함',.38,.07,.18,.16],['도서관',.68,.07,.25,.16],['급식실',.06,.67,.25,.19],['보건실',.40,.70,.18,.16],['체육창고',.70,.68,.23,.18],['화분',.46,.34,.08,.12],['책장',.16,.37,.13,.18],['긴 책상',.68,.38,.18,.10]];
function size(){W=c.width=innerWidth;H=c.height=innerHeight-58}size();addEventListener('resize',size);
function rand(){return {x:40+Math.random()*(W-80),y:50+Math.random()*(H-100),vx:(Math.random()-.5)*90,vy:(Math.random()-.5)*90,caught:false}}
function begin(demo){document.querySelector('#join').style.display='none';running=true;me={...rand(),name:document.querySelector('#nick').value.trim()||'나'};bots=[];for(let i=0;i<(demo?24:8);i++)bots.push({...rand(),name:(i+1)+'번'});seeker=Math.random()<.12;start=performance.now();document.querySelector('#phase').textContent=seeker?'🔎 나는 술래':'🙈 숨는 사람';requestAnimationFrame(loop)}
document.querySelector('#play').onclick=()=>begin(false);document.querySelector('#demo').onclick=()=>begin(true);
addEventListener('keydown',e=>{if(!running)return;let k=e.key.toLowerCase();keys[k]=1;if(k==='h'&&!seeker)hidden=!hidden;if(e.code==='Space'&&seeker){for(const b of bots)if(!b.caught&&Math.hypot(b.x-me.x,b.y-me.y)<60)b.caught=true}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function loop(t){let dt=Math.min(.03,(t-last)/1000||0);last=t;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),l=Math.hypot(dx,dy)||1;me.x=Math.max(18,Math.min(W-18,me.x+dx/l*210*dt));me.y=Math.max(18,Math.min(H-18,me.y+dy/l*210*dt));
for(const b of bots){if(b.caught)continue;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<20||b.x>W-20)b.vx*=-1;if(b.y<20||b.y>H-20)b.vy*=-1;if(!seeker&&Math.random()<.008){let a=Math.atan2(me.y-b.y,me.x-b.x);b.vx=Math.cos(a)*110;b.vy=Math.sin(a)*110;if(Math.hypot(b.x-me.x,b.y-me.y)<28){document.querySelector('#toast').textContent='잡혔어요! 데모에서는 계속 연습할 수 있어요.'}}}
draw();let sec=Math.max(0,180-Math.floor((t-start)/1000));document.querySelector('#time').textContent='⏱ '+String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');document.querySelector('#alive').textContent='🙈 '+(bots.filter(b=>!b.caught).length+(seeker?0:1));if(running)requestAnimationFrame(loop)}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#dcebd3';x.fillRect(0,0,W,H);x.strokeStyle='#c3d3ba';x.lineWidth=2;for(let i=0;i<W;i+=90){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(const [n,px,py,pw,ph] of obs){let ox=px*W,oy=py*H,ow=pw*W,oh=ph*H;x.fillStyle='#8b6a49';x.fillRect(ox,oy,ow,oh);x.fillStyle='#fff';x.font='bold 14px system-ui';x.fillText(n,ox+10,oy+22)}
for(const b of bots){if(b.caught)continue;person(b,false,false)}person(me,seeker,hidden)}
function person(p,isSeek,isHide){x.save();if(isHide&&!isSeek){x.fillStyle='#56824a';x.fillRect(p.x-17,p.y-17,34,34);x.fillStyle='#244';x.fillText('🌿',p.x-10,p.y+6)}else{x.beginPath();x.fillStyle=isSeek?'#e63946':'#2563eb';x.arc(p.x,p.y,17,0,Math.PI*2);x.fill()}x.fillStyle='#172033';x.font='12px system-ui';x.textAlign='center';x.fillText(p.name,p.x,p.y-24);x.restore()}
draw();
</script></body></html>
